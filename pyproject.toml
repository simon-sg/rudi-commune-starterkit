[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rudi-commune-starterkit"
version = "0.7.5"
description = "Moissonneur générique : à partir d'un code INSEE, peuple un nœud RUDI avec un socle de 13 JDD communaux de base."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    # Bug réel corrigé le 2026-11-14 : un chemin absolu local (valide sur une seule
    # machine) rendait `pip install .` impossible pour quiconque d'autre — remplacé
    # par l'URL git publique déjà utilisée par les workflows CI
    # (.github/workflows/build-executable.yml, deploy-docs.yml). En développement
    # local, utiliser plutôt `pip install --no-deps -e .` puis installer séparément
    # le toolkit en édition locale (voir README.md, § Développement).
    "rudi-harvest-toolkit @ git+https://github.com/simon-sg/rudi-harvest-toolkit.git@v0.6.0",
    "keyring>=24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rudi-commune-starterkit = "rudi_commune_starterkit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
