name: Build executable (Windows + Linux, manuel)

# Déclenchement manuel uniquement : chaque build Windows est publié en Release
# GitHub *brouillon* (draft) — un humain doit explicitement cliquer "Publish
# release" sur GitHub pour le rendre public et téléchargeable par un agent
# municipal. Un artifact de workflow (actions/upload-artifact) ne convient pas
# pour CET usage : son téléchargement exige un compte GitHub avec accès au
# dépôt, ce qu'un agent municipal externe n'a pas.
#
# Le job build-linux, lui, publie un simple artifact de workflow (pas une
# Release) : il n'est PAS destiné à un agent municipal (aucun agent municipal
# visé n'utilise Linux à ce jour), seulement au confort de test de Simon —
# pouvoir vérifier le vrai binaire packagé sans passer par Wine (pseudo-
# terminal, bugs de redirection stdin spécifiques à Wine, etc., rencontrés en
# pratique le 2026-11-13).
on:
  workflow_dispatch:
    inputs:
      toolkit_ref:
        description: "Tag/branche de rudi-harvest-toolkit à utiliser pour le build"
        required: true
        default: "v0.5.9"
      version:
        description: "Nom de la release GitHub à créer (ex: v0.7.0-exe1)"
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    # Requis pour que le GITHUB_TOKEN par défaut puisse créer la Release en
    # brouillon (softprops/action-gh-release) — sans ce bloc, échec
    # "Resource not accessible by integration" (constaté en CI le 2026-11-11).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-starterkit
        with:
          toolkit_ref: ${{ inputs.toolkit_ref }}
          shell: pwsh

      - name: Smoke-test (démarrage sans crash d'import/DLL)
        # Stdin vide (PowerShell Start-Process -RedirectStandardInput exige un vrai
        # fichier, "NUL" n'est pas résolu comme le périphérique nul contrairement à
        # cmd.exe) : le wizard lève EOFError dès la première question (code de sortie
        # 1 attendu et normal — pas un signe de crash).
        #
        # Bug réel corrigé le 2026-11-14 : ce smoke-test ne pouvait quasiment jamais
        # échouer — il ne vérifiait QUE l'absence du mot "Traceback", donc un exe qui
        # ne démarre pas du tout (DLL manquante avec un échec natif Windows sans
        # texte), ou qui reste bloqué (le kill après 5s n'était jamais traité comme un
        # échec), passait quand même. On vérifie désormais EN PLUS : (a) que le
        # bandeau de démarrage de l'assistant a bien été imprimé (preuve que
        # executer_interactif() a réellement démarré), et (b) que le process a bien
        # terminé seul dans les 5s (sinon il est resté bloqué — fuite ou deadlock).
        shell: pwsh
        run: |
          New-Item -ItemType File -Path "smoke-stdin-vide.txt" -Force | Out-Null
          $proc = Start-Process -FilePath ".\dist\rudi-commune-starterkit.exe" `
            -RedirectStandardInput "smoke-stdin-vide.txt" `
            -RedirectStandardOutput "smoke-stdout.log" -RedirectStandardError "smoke-stderr.log" `
            -PassThru
          Start-Sleep -Seconds 5
          $bloque = -not $proc.HasExited
          if ($bloque) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          $sortie = (Get-Content smoke-stdout.log -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content smoke-stderr.log -Raw -ErrorAction SilentlyContinue)
          if ($sortie -match "Traceback \(most recent call last\)") {
            Write-Error "Traceback Python au démarrage (probable import/DLL manquant) :`n$sortie"
            exit 1
          }
          if ($bloque) {
            Write-Error "L'exécutable est resté bloqué plus de 5s (stdin vide attendu -> EOFError rapide) :`n$sortie"
            exit 1
          }
          if ($sortie -notmatch "rudi-commune-starterkit") {
            Write-Error "Le bandeau de démarrage de l'assistant n'a jamais été imprimé — l'exe a échoué silencieusement avant d'atteindre executer_interactif() :`n$sortie"
            exit 1
          }

      - name: Calculer le SHA-256 de l'exécutable
        # Permet à un agent municipal (ou à Simon) de vérifier l'intégrité du
        # téléchargement avant de lancer un binaire non signé (voir « Premiers
        # avertissements » du guide) — pas un remplacement de la signature de code.
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/rudi-commune-starterkit.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  rudi-commune-starterkit.exe" | Out-File -Encoding ascii dist/rudi-commune-starterkit.exe.sha256

      - name: Publier une Release GitHub en brouillon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          files: |
            dist/rudi-commune-starterkit.exe
            dist/rudi-commune-starterkit.exe.sha256

  build-linux:
    # Confort de test pour Simon (binaire natif à lancer sans Wine) — pas une
    # distribution publique. Indépendant de build-windows, aucune Release créée.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-starterkit
        with:
          toolkit_ref: ${{ inputs.toolkit_ref }}
          shell: bash

      - name: Smoke-test (démarrage sans crash d'import)
        # Même logique que le smoke-test Windows (voir son commentaire pour le détail
        # du bug réel corrigé le 2026-11-14) : on vérifie en plus l'absence de timeout
        # (process resté bloqué) et la présence du bandeau de démarrage, pas
        # seulement l'absence de traceback.
        run: |
          : > smoke-stdin-vide.txt
          if timeout 10 ./dist/rudi-commune-starterkit < smoke-stdin-vide.txt \
            > smoke-stdout.log 2> smoke-stderr.log; then
            code=0
          else
            code=$?
          fi
          if grep -q "Traceback (most recent call last)" smoke-stdout.log smoke-stderr.log; then
            echo "Traceback Python au démarrage (probable import manquant) :"
            cat smoke-stdout.log smoke-stderr.log
            exit 1
          fi
          if [ "$code" -eq 124 ]; then
            echo "L'exécutable est resté bloqué plus de 10s (stdin vide attendu -> EOFError rapide) :"
            cat smoke-stdout.log smoke-stderr.log
            exit 1
          fi
          if ! grep -q "rudi-commune-starterkit" smoke-stdout.log smoke-stderr.log; then
            echo "Le bandeau de démarrage de l'assistant n'a jamais été imprimé — l'exe a échoué silencieusement avant d'atteindre executer_interactif() :"
            cat smoke-stdout.log smoke-stderr.log
            exit 1
          fi

      - name: Publier le binaire Linux comme artifact (test interne)
        uses: actions/upload-artifact@v4
        with:
          name: rudi-commune-starterkit-linux
          path: dist/rudi-commune-starterkit
          retention-days: 14
